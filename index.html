<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TÂN × ÁI TRÂN — The Chronicle of Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080D;--night:#111524;--plum:#24162D;--wine:#501D36;--rose:#9C617D;--gold:#D6B887;--ivory:#EDE4DF;--mute:#8F95A7;
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--hand:Caveat,"Segoe Script",cursive}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ivory);font-family:var(--sans);font-weight:300;line-height:1.8;font-size:17px;overflow-x:hidden}
.ch{min-height:100vh;min-height:100svh;padding:12vh 6vw;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.ch>*{max-width:720px;width:100%}
.act{font-size:11px;letter-spacing:.4em;color:var(--gold);text-transform:uppercase;margin-bottom:1rem}
.date{font-family:var(--serif);font-size:clamp(2.4rem,9vw,5rem);color:var(--gold);line-height:1.1}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.7rem,5.5vw,3.2rem);line-height:1.2;margin:.6rem 0 .4rem;letter-spacing:.03em}
.vi{font-style:italic;color:var(--rose);font-family:var(--serif);font-size:1.25rem;margin-bottom:1.5rem}
.body p{margin:0 0 1.15rem;color:#d9d0cc}
.rv{opacity:0;transform:translateY(24px);transition:opacity 1.1s,transform 1.1s}
.rv.in{opacity:1;transform:none}
.btn{display:inline-block;margin-top:1.4rem;padding:.85rem 1.6rem;min-height:44px;border:1px solid var(--gold);color:var(--gold);background:transparent;font:inherit;font-size:12px;letter-spacing:.25em;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:.4s}
.btn:hover,.btn:focus-visible{background:var(--gold);color:var(--bg);outline:none}
.btn.soft{border-color:#444a5e;color:var(--mute)}
.frame{width:min(100%,520px);aspect-ratio:4/5;margin:1.5rem auto;border-radius:3px;overflow:hidden;position:relative;background:linear-gradient(160deg,var(--plum),var(--night) 60%,var(--wine));box-shadow:0 30px 80px #000a,0 0 0 1px #ffffff12;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.frame.wide{aspect-ratio:16/10}
.frame img{width:100%;height:100%;object-fit:cover;display:none}
.frame.has img{display:block}
.frame.has .ph{display:none}
.ph{font-family:var(--serif);font-size:1.4rem;color:var(--rose);letter-spacing:.2em;text-transform:uppercase;padding:1rem;text-align:center;opacity:.8}
.ph small{display:block;font-size:.7rem;letter-spacing:.3em;color:var(--mute);margin-top:.5rem;font-family:var(--sans)}
/* intro */
#intro{background:radial-gradient(ellipse at 50% 60%,var(--night),var(--bg) 70%)}
#sig{width:min(90%,520px);height:120px;margin-bottom:1.5rem}
.dot{fill:var(--gold);opacity:0;animation:pop 2s forwards}
.dot.b{fill:var(--rose);animation-delay:1.6s}
.path{stroke:var(--gold);stroke-width:1;fill:none;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 3s 2.8s forwards;opacity:.7}
@keyframes pop{to{opacity:1}}@keyframes draw{to{stroke-dashoffset:0}}
#intro h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,9vw,5rem);letter-spacing:.12em;opacity:0;animation:pop 2s 3.5s forwards}
.q{font-family:var(--serif);font-style:italic;color:var(--ivory);font-size:1.2rem;margin:1rem 0;opacity:0;animation:pop 2s 4.5s forwards}
#intro .btn,#intro .hint{opacity:0;animation:pop 2s 5.5s forwards}
.hint{font-size:.8rem;color:var(--mute);font-style:italic;margin-top:1.6rem}
.skipfx{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:30;font-size:11px;padding:.5rem .8rem;min-height:36px}
body.fx-off *{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}
/* act colours */
.a2{background:linear-gradient(180deg,var(--bg),#14142b)}.a3{background:linear-gradient(180deg,#14142b,var(--plum))}
.a4{background:linear-gradient(180deg,var(--plum),#17101f)}.a5{background:linear-gradient(180deg,#17101f,#0b0b12)}
.a6{background:radial-gradient(circle at 50% 40%,var(--wine),var(--bg) 75%)}.a7{background:linear-gradient(180deg,var(--bg),var(--plum))}
.sig{width:2px;height:90px;background:linear-gradient(var(--gold),transparent);margin:2.5rem auto 0;opacity:.6}
.pts{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin:1.5rem 0}
.pt{padding:.7rem 1.2rem;min-height:44px;border:1px solid #ffffff22;background:#ffffff08;color:var(--ivory);font:inherit;cursor:pointer;border-radius:30px}
.pt:hover,.pt.on{border-color:var(--gold);color:var(--gold)}
.note{min-height:3.5rem;font-style:italic;color:var(--rose);font-family:var(--serif);font-size:1.2rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin:1.5rem 0;max-width:720px}
.card{padding:1.1rem .8rem;min-height:90px;background:linear-gradient(150deg,#ffffff0d,#ffffff04);border:1px solid #ffffff18;color:var(--ivory);font:inherit;cursor:pointer;border-radius:4px;font-family:var(--serif);font-size:1.1rem;transition:.4s}
.card:hover{border-color:var(--gold);transform:translateY(-3px)}
.const{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;margin:1rem 0}
.const .frame{width:min(100%,200px);aspect-ratio:9/16;cursor:default}
.const figure{flex:1 1 180px;max-width:220px}.const figcaption{font-size:.8rem;letter-spacing:.25em;color:var(--gold)}
.lead{font-family:var(--serif);font-size:1.35rem;color:var(--ivory)}
.wave{display:flex;gap:4px;align-items:center;justify-content:center;height:50px;margin:1rem 0}
.wave i{width:3px;background:var(--gold);height:10px;border-radius:2px;opacity:.7}
body.playing .wave i{animation:wv 1.1s ease-in-out infinite}
.wave i:nth-child(odd){animation-delay:.25s!important}.wave i:nth-child(3n){animation-delay:.5s!important}
@keyframes wv{50%{height:44px}}
.goals{list-style:none;text-align:left;margin:1rem 0}
.goals li{padding:.6rem 0;border-bottom:1px solid #ffffff12;display:flex;gap:.8rem;align-items:center;cursor:pointer}
.goals li::before{content:"";width:18px;height:18px;border:1px solid var(--gold);border-radius:50%;flex:none}
.goals li.done::before{background:var(--gold)}.goals li.done{color:var(--mute);text-decoration:line-through}
.zones{display:grid;gap:1.2rem;text-align:left;margin:1rem 0}
.zone{border-left:1px solid var(--gold);padding-left:1rem}.zone h3{font-family:var(--serif);font-weight:400;font-size:1.4rem;color:var(--gold)}
.zone ul{padding-left:1.1rem;color:#cfc6c2;font-size:.95rem}
.date-big{font-family:var(--serif);font-size:clamp(3rem,13vw,7rem);color:var(--gold);letter-spacing:.05em}
.dots{display:flex;justify-content:center;gap:2rem;margin:1rem 0}.dots b{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 30px 8px #d6b88766;animation:glide 4s ease-out both}
.dots b+b{background:var(--rose);box-shadow:0 0 30px 8px #9c617d66}
@keyframes glide{from{transform:translateX(-40vw)}}.dots b+b{animation-name:glide2}@keyframes glide2{from{transform:translateX(40vw)}}
/* letter */
.env{width:min(100%,380px);aspect-ratio:3/2;background:linear-gradient(160deg,#2a1a30,var(--wine));border:1px solid var(--gold);border-radius:4px;margin:1.5rem auto;display:flex;align-items:center;justify-content:center;font-family:var(--serif);letter-spacing:.3em;color:var(--gold);position:relative;box-shadow:0 20px 60px #000a}
.paper{background:#efe6dc;color:#2b2326;padding:clamp(1.5rem,6vw,3.5rem);text-align:left;font-family:var(--serif);font-size:1.2rem;line-height:2;border-radius:2px;margin-top:1.5rem;display:none;max-width:720px}
.paper.open{display:block}
.paper p{margin-bottom:1.2rem}.paper h3{font-weight:600;font-size:1.5rem;margin-bottom:1.5rem}
.paper p,.paper h3{opacity:0;animation:pop 1.2s forwards}
.paper.all p,.paper.all h3{opacity:1;animation:none}
.sign{font-family:var(--hand);font-size:2rem;color:var(--wine)}
/* journal */
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.8rem;width:100%;max-width:900px;text-align:left}
.page{min-height:110px;padding:1rem;border:1px dashed #ffffff33;background:#ffffff06;color:var(--mute);font:inherit;font-size:.95rem;cursor:pointer;border-radius:3px;text-align:left}
.page.filled{border-style:solid;border-color:var(--gold);color:var(--ivory)}.page small{display:block;color:var(--rose);font-size:.75rem;margin-top:.5rem}
.tools{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.hug{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:5rem;opacity:0;z-index:40}
.hug.go{animation:hug 2.4s ease-out}
@keyframes hug{0%{opacity:0;transform:scale(.4);filter:blur(6px)}30%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.8);filter:blur(10px)}}
.end{padding:8vh 6vw 14vh;text-align:center;font-family:var(--serif);font-size:clamp(1.3rem,4.5vw,2rem);font-style:italic;color:var(--gold)}
/* modal */
.modal{position:fixed;inset:0;background:#05060bee;z-index:50;display:none;align-items:center;justify-content:center;padding:max(1rem,env(safe-area-inset-top)) 1rem 1rem;overflow:auto}
.modal.open{display:flex}
.mbox{max-width:560px;width:100%;max-height:92vh;overflow:auto;background:linear-gradient(160deg,var(--night),var(--plum));border:1px solid #ffffff22;padding:1.5rem;text-align:left;border-radius:4px}
.mbox img{max-width:100%;max-height:60vh;display:block;margin:0 auto 1rem;border-radius:2px}
.mbox h3{font-family:var(--serif);font-weight:400;font-size:1.7rem;margin-bottom:.6rem}
.mbox input,.mbox textarea{width:100%;margin:.4rem 0;padding:.7rem;background:#00000044;border:1px solid #ffffff22;color:var(--ivory);font:inherit;font-size:16px;border-radius:3px}
.mbox textarea{min-height:160px}
.x{float:right;min-width:44px;min-height:44px;background:none;border:0;color:var(--gold);font-size:1.6rem;cursor:pointer}
#audio{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:30;width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);background:#07080dcc;color:var(--gold);font-size:18px;cursor:pointer;display:none}
#prog{position:fixed;top:0;left:0;height:2px;background:var(--gold);width:0;z-index:60}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
[hidden]{display:none!important}
.ch{background:none!important}
.glow{position:fixed;inset:0;z-index:-1;opacity:0;transition:opacity 1.8s}
#pt{position:fixed;inset:0;z-index:0;pointer-events:none}
.grain{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#wipe{position:fixed;inset:0;z-index:65;pointer-events:none;transform:translateX(-101%)}
#chlabel{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:35;font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
#chlabel.show{opacity:.9}
body.tabhid *{animation-play-state:paused!important}
.ch>.beam{position:absolute;max-width:none;height:1px;pointer-events:none;opacity:0;top:0;left:0}
/* Không dùng clip-path trên chính .frame: phần tử bị cắt hết sẽ không bao giờ "giao" với màn hình nên IntersectionObserver không bao giờ báo, ảnh kẹt ở trạng thái ẩn */
.frame.rv{filter:blur(6px);transition:filter 1.2s,opacity 1s,transform 1.1s}
.frame.rv>img,.frame.rv>.ph{clip-path:inset(0 0 100% 0);transition:clip-path 1.2s cubic-bezier(.2,.8,.2,1)}
.frame.rv.in{filter:none}
.frame.rv.in>img,.frame.rv.in>.ph{clip-path:inset(0)}
#freefire .frame img,#flower .frame img{transform:scale(1.3);transition:transform 4s cubic-bezier(.2,.8,.2,1)}
#freefire .frame.in img,#flower .frame.in img{transform:none}
h2.rv{transition:opacity .9s,transform .9s}
/* intro */
#intro{position:relative;overflow:hidden}
#intro .stage{position:relative;max-width:720px;min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.i-dot,.i-ring,.i-line{position:absolute;pointer-events:none;opacity:0}
.i-dot{left:50%;top:22%;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--gold);box-shadow:0 0 24px 6px #d6b88777;animation:pop 1.2s .4s forwards}
.i-ring{left:50%;top:22%;width:20px;height:20px;margin:-10px;border:1px solid var(--gold);border-radius:50%;animation:ring 2.2s 1.4s ease-out forwards}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(60)}}
.i-line{top:22%;left:-10%;width:30%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:sweep 1.6s 2s ease-in-out forwards}
@keyframes sweep{0%{opacity:0;transform:translateX(0)}20%{opacity:1}100%{opacity:0;transform:translateX(420%)}}
.mask{display:block;overflow:hidden}.mask>span{display:block;transform:translateY(110%);animation:up 1.1s var(--d,0s) cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{to{transform:none}}
.fi{opacity:0;animation:pop 1.4s var(--d,0s) forwards}
.i-names{display:flex;align-items:center;justify-content:center;gap:.8rem;font-family:var(--serif);font-size:clamp(1.8rem,8vw,4.2rem);letter-spacing:.1em;margin-top:1.4rem;flex-wrap:wrap}
.i-names .l,.i-names .r,.i-names .x{opacity:0;animation-duration:1.2s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:forwards}
.i-names .l{animation-name:inl;animation-delay:4.6s}.i-names .r{animation-name:inr;animation-delay:4.6s}.i-names .x{animation-name:pop;animation-delay:5.3s;color:var(--gold)}
@keyframes inl{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes inr{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.i-rule{height:1px;width:0;background:var(--gold);margin:1rem auto;animation:grow 1.2s 5.3s forwards}
@keyframes grow{to{width:min(60%,260px)}}
#intro.skip *{animation-duration:.01s!important;animation-delay:0s!important}
.isk{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;margin:0;padding:.5rem .9rem;font-size:11px;z-index:3}
/* timeline + kinetic */
.tl{position:relative;width:100%;max-width:560px;text-align:left;padding-left:2rem;margin:1rem auto}
.tl::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:1px;background:#ffffff1f}
.tlf{position:absolute;left:6px;top:0;width:1px;height:0;background:linear-gradient(var(--gold),var(--rose));box-shadow:0 0 10px var(--gold)}
.tn{position:relative;padding:.4rem 0 1.6rem;opacity:.25;transition:opacity .8s,transform .8s;transform:translateX(10px)}
.tn::before{content:"";position:absolute;left:-2rem;top:.9rem;width:13px;height:13px;border-radius:50%;background:var(--bg);border:1px solid var(--gold)}
.tn.on{opacity:1;transform:none}.tn.on::before{background:var(--gold);box-shadow:0 0 14px var(--gold)}
.tn b{display:block;font-family:var(--serif);font-weight:400;color:var(--gold);font-size:1.3rem}.tn.big b{font-size:1.9rem}
.kn{font-family:var(--serif);font-size:clamp(2.2rem,10vw,5.5rem);line-height:1.15;margin:.3rem 0}
/* player */
#mp{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:45}
#mp.na{display:none}
.mpb{width:48px;height:48px;border-radius:50%;border:1px solid var(--gold);background:#07080dbb;backdrop-filter:blur(6px);color:var(--gold);cursor:pointer;font-size:18px;position:relative}
body.playing .mpb::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid var(--gold);animation:ring2 2.4s ease-out infinite}
@keyframes ring2{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(1.8)}}
.mpp{position:absolute;right:0;bottom:58px;width:min(300px,calc(100vw - 24px));padding:1rem;background:#0d0e18f2;border:1px solid #d6b88755;border-radius:14px;transform-origin:100% 100%;transform:scale(.6) translateY(20px);opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.8,.2,1)}
#mp.open .mpp{transform:none;opacity:1;pointer-events:auto}
.mpt{font-family:var(--serif);letter-spacing:.2em;color:var(--gold)}.mps{font-size:.8rem;color:var(--mute)}
.mpr{display:flex;align-items:center;gap:.5rem;margin:.4rem 0}.mpr input{flex:1;accent-color:var(--gold);min-width:0}
.mpc{width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold);cursor:pointer;flex:none}.mpc.sm{width:36px;height:36px}
.mpd{display:flex;justify-content:space-between;font-size:.75rem;color:var(--mute)}
.mpw{display:flex;gap:3px;height:24px;align-items:center;margin:.6rem 0}.mpw i{width:2px;height:5px;background:var(--gold);border-radius:1px}
body.playing .mpw i{animation:wv2 1.1s ease-in-out infinite}.mpw i:nth-child(odd){animation-delay:.3s!important}.mpw i:nth-child(3n){animation-delay:.6s!important}
@keyframes wv2{50%{height:22px}}
body.playing .ring-p::after{content:"";position:absolute;inset:0;border:1px solid var(--gold);border-radius:3px;animation:ring2 3s ease-out infinite}
/* letter */
.stage3{perspective:900px;margin:1.5rem auto;width:min(100%,380px)}
.envx{position:relative;aspect-ratio:3/2;background:linear-gradient(160deg,#2a1a30,var(--wine));border:1px solid var(--gold);border-radius:4px;box-shadow:0 20px 60px #000a}
.envx .sheet{position:absolute;left:8%;right:8%;top:8%;bottom:8%;background:#efe6dc;transition:transform .9s .5s cubic-bezier(.2,.8,.2,1)}
.envx .flap{position:absolute;left:0;right:0;top:0;height:55%;background:linear-gradient(#3a2036,var(--wine));clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s cubic-bezier(.4,0,.2,1);z-index:2}
.envx .lbl{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10%;z-index:3;letter-spacing:.3em;color:var(--gold);font-family:var(--serif);transition:opacity .4s}
.envx.open .flap{transform:rotateX(180deg);z-index:0}.envx.open .sheet{transform:translateY(-45%)}.envx.open .lbl{opacity:0}
#reader{position:fixed;inset:0;z-index:55;background:#07080df5;display:none;flex-direction:column}
#reader.open{display:flex;animation:rd .6s cubic-bezier(.2,.8,.2,1)}
@keyframes rd{from{opacity:0;transform:translateY(30px)}}
.rbar{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;padding:max(.6rem,env(safe-area-inset-top)) .8rem .6rem;border-bottom:1px solid #ffffff12}
.rbar .btn{margin:0;padding:.5rem .9rem;font-size:11px}
.rscroll{flex:1;overflow:auto;padding:1.5rem 1rem 4rem;-webkit-overflow-scrolling:touch}
.rscroll .paper{display:block;margin:0 auto}.rend{text-align:center;margin-top:2rem}
/* finale */
.reprise{width:min(100%,520px);height:auto;margin:1rem auto}
.reprise .t{opacity:0;animation:pop 1.2s var(--d,0s) forwards;animation-play-state:paused}
.hz{stroke-dasharray:600;stroke-dashoffset:600;animation:draw2 4s 3.2s forwards;animation-play-state:paused}
@keyframes draw2{to{stroke-dashoffset:0}}
#finale.go .t,#finale.go .hz{animation-play-state:running}
.blank{width:min(100%,360px);margin:2rem auto;padding:2.2rem 1.4rem;background:#efe6dc;color:#2b2326;font-family:var(--serif);font-size:1.4rem;font-style:italic;border-radius:2px;transform:rotate(-1deg);box-shadow:0 30px 60px #000a}
</style>
</head>
<body>
<div id="prog"></div>
<button class="btn soft skipfx" id="skipfx" type="button">Bỏ qua hiệu ứng</button>
<div id="wipe"></div><div class="glow" id="glowA"></div><div class="glow" id="glowB"></div><canvas id="pt"></canvas><div id="chlabel"></div><div class="grain"></div>
<div class="hug" id="hug" aria-hidden="true">💗</div>
<main id="main"></main>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="mbox"><button class="x" id="mx" type="button" aria-label="Đóng">×</button><div id="mc"></div></div></div>
<audio id="bgm" preload="none" loop></audio>

<script>

  letter: `Gửi Ái Trân — cô gái quý giá nhất trong lòng anh,

Nếu trái tim anh là một vương quốc, thì em chính là vì sao sáng nhất trên bầu trời ấy, là người mà anh luôn muốn dành vị trí trang trọng nhất. Anh không cần em phải làm điều gì lớn lao để chứng minh rằng em đặc biệt. Chỉ cần em là Ái Trân — với giọng nói anh thương, cách em làm nũng, cách em vui buồn rất thật, những suy nghĩ tinh tế và cả những nét bướng bỉnh đáng yêu — em đã là người khiến anh muốn cúi đầu trước sự quý giá của tình yêu này, không phải vì anh thấp kém, mà vì anh biết mình đang được trao một điều không nên bao giờ xem nhẹ.

Anh nhớ những câu “hứ”, “hớ”, “ừm ừ ờ”, những lần em bảo em giận anh, dọa đánh anh, hỏi sao anh không hun em, gọi anh là “ĐỒ Tồiiiiiiii”, “VÔ TÂM KÌA”, hay chào anh trai lạnh lùng như thể muốn bắt anh phải dỗ dành em ngay lập tức. Có những lúc anh bật cười vì sự đáng yêu ấy, có lúc còn chưa biết nên trả lời thế nào cho đúng, nhưng càng về sau anh càng hiểu: đó là một phần rất riêng của em, là cách em làm nũng với người em cho phép bước gần vào thế giới của mình. Anh trân trọng đặc quyền nhỏ bé ấy hơn những gì anh có thể nói thành lời.

Anh cũng nhớ những câu hỏi nghe qua tưởng rất nhỏ: “Anh giận hả?”, “Anh hết thương rồi hả?”, hay những lúc em nhận ra giọng điệu của anh khác đi, câu trả lời chậm hơn thường ngày, rồi trong lòng bắt đầu có những suy nghĩ mà anh chưa kịp nhận ra. Anh biết em để ý rất nhiều, nhớ cả những điều người khác có thể bỏ qua. Em còn ghi lại những chuyện khiến em vui, khiến em buồn, những điều anh đã hứa, những đoạn trò chuyện và những dấu vết em sợ một ngày nào đó sẽ bị quên mất. Có lẽ đôi khi anh chưa hiểu hết vì sao một điều nhỏ lại có thể khiến em suy nghĩ lâu đến vậy; nhưng anh không muốn vì chưa hiểu mà xem nhẹ nó.

Anh muốn học cách dịu dàng hơn với trái tim của em. Nếu có lúc em bất an, anh mong mình đủ rõ ràng để em không phải tự đoán. Nếu em buồn, anh mong em có thể nói với anh mà không cần sợ rằng cảm xúc của mình sẽ khiến anh khó chịu. Nếu anh làm em tổn thương, anh mong mình đủ khiêm nhường để lắng nghe và nhận ra phần chưa tốt của bản thân. Anh không dám hứa rằng mình sẽ chẳng bao giờ vụng về, nhưng anh muốn mỗi lần vụng về đều trở thành lý do để anh học cách yêu em tốt hơn.

Có một điều ở em khiến anh luôn ngưỡng mộ: em không chỉ có một vẻ đáng yêu mà anh muốn dỗ dành. Em còn là cô gái có rất nhiều điều để anh tiếp tục khám phá — sự kiên trì của em, đôi tay có thể nấu ăn, khả năng hát, sự sáng tạo khi vẽ và nghĩ ra những thiết kế hình xăm, cùng những điều thú vị em biết về tiếng Trung, ký hiệu, mã Morse hay những nút thắt cắm trại. Em có nhiều mặt mà có lẽ anh vẫn chưa biết hết. Càng nghĩ về điều đó, anh càng thấy mình may mắn khi được ở gần em và có cơ hội nhìn thấy thêm từng phần trong thế giới của em.

Anh còn nhớ những trò chơi kinh dị mà em vốn cũng sợ, vậy mà có lúc em lại đi trước như muốn bảo vệ anh. Có lẽ em không cần nói một lời thật hoa mỹ; hành động nhỏ ấy cũng đủ khiến anh thấy em vừa đáng yêu vừa mạnh mẽ. Anh thích cả lúc em chọc ghẹo anh, cả lúc em nghiêm túc, cả lúc em thể hiện sự quan tâm theo cách rất riêng. Được nhìn thấy những sắc thái khác nhau ấy của em là một niềm vui mà anh không muốn coi như điều bình thường.

Anh trân trọng những cuộc gọi của chúng ta, những lúc được nghe giọng em, những câu chuyện đôi khi chẳng cần chủ đề gì lớn lao mà vẫn khiến anh muốn ở lại thêm một chút. Sau mỗi cuộc gọi, anh còn ghi chú lại những điều chúng ta vừa nói, bởi anh sợ thời gian sẽ làm mờ đi những chi tiết đáng quý. Anh muốn giữ lại cảm giác của hôm nay, để sau này nếu có mở lại những dòng ghi chú ấy, anh vẫn nhớ rằng đã từng có một cô gái khiến những khoảnh khắc bình thường trở nên đáng để lưu giữ như vậy.

Anh cũng không quên những chặng đường chẳng hoàn toàn dễ dàng. Đã có lúc chúng ta chưa rõ ràng, có lúc xa cách, có những điều làm cả hai phải suy nghĩ và có khi chưa biết làm sao để hiểu nhau. Rồi em quay lại, nói lời xin lỗi và muốn được tiếp tục có mặt trong cuộc sống của anh. Anh biết việc mở lòng lại không phải điều có thể xem nhẹ. Vì vậy, anh càng biết ơn cơ hội mà chúng ta đã cho nhau — cơ hội để trò chuyện thêm, để nói rõ hơn, để hiểu nhau hơn và để không để những điều cũ quyết định toàn bộ những gì chúng ta có thể trở thành.

Anh vẫn nhớ, bó hoa anh tặng em — bó hoa đầu tiên em nhận từ bạn trai — và dòng chữ “I Love You 3000” em đăng cùng bó hoa ấy. Anh không biết em đã cảm nhận khoảnh khắc đó như thế nào trong tất cả những cảm xúc riêng của em, nhưng với anh, nó trở thành một kỷ niệm anh muốn cất giữ thật lâu. Anh đã vui vì có thể làm em vui một chút, vì có thể gửi đến em một điều hữu hình để thay cho những lời yêu thương vốn thường khó diễn tả hết. Nếu sau này em nhìn lại tấm ảnh ấy, anh mong em vẫn cảm nhận được sự trân trọng mà anh gửi vào bó hoa đó.

/* Lỗi cũ: ảnh vừa bị display:none vừa loading="lazy" nên trình duyệt không bao giờ tải ảnh -> onload không chạy -> ảnh không hiện.
   Cách sửa: tự tải ảnh bằng JS (không lazy), thử lần lượt nhiều tên/đuôi file, chỉ hiện khung ảnh khi tải xong. */
const IMG_EXTS = ["jpg", "jpeg", "png", "webp", "JPG", "JPEG", "PNG"];
function imgCandidates(name) {
  const manual = SITE_CONFIG.photos && SITE_CONFIG.photos[name];
  if (manual) return [].concat(manual);               // tên file Tân tự điền trong SITE_CONFIG.photos
  const base = SITE_CONFIG.img(name).replace(/\.[a-z]+$/i, ""), out = [];
  [base, name, "images/" + name, "images/" + base].forEach(b => IMG_EXTS.forEach(x => out.push(b + "." + x)));
  return out.filter((v, i, a) => a.indexOf(v) === i);
}
const imgIO = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { imgIO.unobserve(e.target); if (e.target._load) e.target._load(); }
}), { rootMargin: "900px 0px" }) : null;
function frame(name, label, wide) {
  const f = h("div", "frame" + (wide ? " wide" : ""));
  const ph = h("div", "ph", label, [h("small", "", "image" + name + ".jpg")]);
  f.appendChild(ph);
  const list = imgCandidates(name);
  f._load = () => {
    if (f._started) return; f._started = 1;
    let i = 0; const img = new Image(); img.alt = label; img.decoding = "async";
    img.onload = () => { f.prepend(img); f.dataset.src = img.src; f.classList.add("has"); };
    img.onerror = () => { if (++i < list.length) img.src = list[i]; };
    img.src = list[0];
  };
  if (imgIO) imgIO.observe(f); else f._load();
  return f;
}

const GLOW = { freefire: "#111524", discord: "#1c1b3f", zalo: "#24162D", mess: "#2a1838", social: "#1a1730", phone: "#2b1a33", distance: "#14141c", "return": "#3a1a2c", kinetic: "#12121f", official: "#501D36", timeline: "#1b1830", small: "#24162D", girl: "#2a1730", safe: "#141322", flower: "#5a2236", man: "#101526", future: "#1b1830", letter: "#3a1a2c", archive: "#24162D", finale: "#12111f" };
const BEAM = { freefire: ["#D6B887", "r", 1600], discord: ["#8b8dff", "v", 1400], zalo: ["#9C617D", "l", 1800], mess: ["#c79bd6", "r", 1200], social: ["#D6B887", "v", 1000], phone: ["#D6B887", "l", 2000], distance: ["#8F95A7", "r", 2400], "return": ["#D6B887", "v", 2200] };
let gi = 0, lastGlow = "";
function setGlow(c) { if (!c || c === lastGlow) return; lastGlow = c; const n = $(gi ? "#glowA" : "#glowB"); n.style.background = "radial-gradient(ellipse at 50% 45%," + c + ",var(--bg) 78%)"; n.style.opacity = 1; $(gi ? "#glowB" : "#glowA").style.opacity = 0; gi ^= 1; }
function jump(el) { const r = document.documentElement; r.style.scrollBehavior = "auto"; el.scrollIntoView(); r.style.scrollBehavior = ""; }
function wipe(color, cb) {
  if (fxoff() || reduced) { cb(); return; }
  const w = $("#wipe"); w.style.background = "linear-gradient(90deg,var(--bg) 60%," + color + ")";
  w.animate([{ transform: "translateX(-101%)" }, { transform: "translateX(0)", offset: .45 }, { transform: "translateX(101%)" }], { duration: 1100, easing: "cubic-bezier(.6,0,.3,1)" });
  setTimeout(cb, 500);
}
function beam(sec) {
  if (sec._b || fxoff() || reduced) return; sec._b = 1;
  const m = BEAM[sec.id] || ["#D6B887", "r", 1400], b = h("div", "beam"), v = m[1] === "v";
  b.style.setProperty("--bc", m[0]);
  b.style.cssText += v ? ";width:1px;height:60%;left:50%;background:linear-gradient(transparent," + m[0] + ",transparent)" : ";width:60%;background:linear-gradient(90deg,transparent," + m[0] + ",transparent)";
  sec.prepend(b);
  const kf = v ? [{ opacity: 0, transform: "translateY(-100%)" }, { opacity: 1, offset: .3 }, { opacity: 0, transform: "translateY(170%)" }]
    : [{ opacity: 0, transform: m[1] === "l" ? "translateX(170%)" : "translateX(-100%)" }, { opacity: 1, offset: .3 }, { opacity: 0, transform: m[1] === "l" ? "translateX(-100%)" : "translateX(170%)" }];
  b.animate(kf, { duration: m[2], easing: "cubic-bezier(.4,0,.2,1)" }).onfinish = () => b.remove();
}
let lblT = 0;
function label(s) { const a = s.querySelector(".act"), l = $("#chlabel"); if (!a || !a.textContent) return; l.textContent = a.textContent; l.classList.add("show"); clearTimeout(lblT); lblT = setTimeout(() => l.classList.remove("show"), 2400); }
function tlUpdate() {
  const tl = $(".tl"); if (!tl) return;
  const r = tl.getBoundingClientRect(), fill = Math.max(0, Math.min(r.height, innerHeight * .65 - r.top));
  $(".tlf").style.height = fill + "px";
  tl.querySelectorAll(".tn").forEach(n => n.classList.toggle("on", n.offsetTop < fill - 10));
}
function particles() {
  const cv = $("#pt"), cx = cv.getContext && cv.getContext("2d"); if (!cx || reduced) return;
  let w, hh, raf = 0; const N = innerWidth < 700 ? 14 : 34, ps = [];
  const rs = () => { w = cv.width = innerWidth; hh = cv.height = innerHeight; }; rs(); addEventListener("resize", rs);
  for (let i = 0; i < N; i++) ps.push({ x: Math.random() * w, y: Math.random() * hh, r: Math.random() * 1.4 + .4, v: Math.random() * .25 + .05, a: Math.random() * .5 + .2 });
  const tick = () => {
    cx.clearRect(0, 0, w, hh); if (fxoff()) return;
    cx.fillStyle = "#D6B887"; ps.forEach(p => { p.y -= p.v; if (p.y < -4) { p.y = hh + 4; p.x = Math.random() * w; } cx.globalAlpha = p.a; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.3); cx.fill(); });
    raf = requestAnimationFrame(tick);
  };
  document.addEventListener("visibilitychange", () => { cancelAnimationFrame(raf); document.body.classList.toggle("tabhid", document.hidden); if (!document.hidden) tick(); });
  tick();
}
function initFx() {
  document.querySelectorAll(".frame").forEach(f => f.classList.add("rv"));
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });
  document.querySelectorAll(".rv").forEach(e => io.observe(e));
  const so = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return; const s = e.target;
    setGlow(GLOW[s.id]); if (s.id === "finale") s.classList.add("go"); if (s.id !== "intro") { beam(s); label(s); }
  }), { rootMargin: "-40% 0px -40% 0px", threshold: 0 });
  document.querySelectorAll("main>section").forEach(s => so.observe(s));
  const pr = $("#prog"), fr = [...document.querySelectorAll(".frame")], par = !reduced && innerWidth >= 760; let q = 0;
  const run = () => {
    q = 0; const m = document.documentElement.scrollHeight - innerHeight; pr.style.width = (m > 0 ? scrollY / m * 100 : 0) + "%"; tlUpdate();
    if (par && !fxoff()) fr.forEach(f => { const r = f.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return; f.style.translate = "0 " + ((r.top + r.height / 2 - innerHeight / 2) * -.07).toFixed(1) + "px"; });
  };
  addEventListener("scroll", () => { if (!q) q = requestAnimationFrame(run); }, { passive: true }); run();
  $("#skipfx").onclick = () => { document.body.classList.add("fx-off"); document.querySelectorAll(".rv").forEach(e => e.classList.add("in")); $("#intro").classList.add("skip"); $("#skipfx").hidden = true; };
  if (reduced) document.body.classList.add("fx-off");

  setTimeout(() => document.querySelectorAll(".frame").forEach(f => { if (f._load) f._load(); }), 2000);
  /* chốt an toàn cho phần hiện dần: nếu sau 6 giây vẫn còn khung chưa hiện thì hiện luôn */
  setTimeout(() => document.querySelectorAll(".frame.rv:not(.in)").forEach(f => { const r = f.getBoundingClientRect(); if (r.top < innerHeight && r.bottom > 0) f.classList.add("in"); }), 6000);
}
/* ============ 9. INIT ============ */
function init() {
  loadJournal(); buildIntro();
  SITE_CONFIG.chapters.slice(0, 1).forEach(buildChapter);
  SITE_CONFIG.chapters.slice(1).forEach(buildChapter);
  buildSocial(); buildPhone(); buildDistance(); buildReturn(); buildKinetic(); buildOfficial(); buildTimeline(); buildSmall(); buildGirl(); buildSafe(); buildFlower(); buildMan(); buildFuture(); buildLetter(); buildArchive(); buildFinale();
  buildPlayer(); initFx();
}
try { init(); } catch (e) { console.error(e); }
